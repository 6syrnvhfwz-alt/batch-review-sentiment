<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>负面评价列表</title>
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: #f44336; }
        .review-card { background: white; border-radius: 12px; padding: 20px; margin: 15px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-left: 4px solid #f44336; }
        .review-text { font-size: 16px; color: #333; margin-bottom: 10px; }
        .review-reason { font-size: 13px; color: #999; }
        .back { text-align: center; margin: 30px 0; }
        .back a { display: inline-block; padding: 10px 20px; background: #2196F3; color: white; text-decoration: none; border-radius: 8px; }
        .summary { text-align: center; color: #666; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚠️ 负面评价列表</h1>
        <p class="summary">共 {{ negatives|length }} 条负面评价</p>

        {% for review in negatives %}
        <div class="review-card">
            <div class="review-text">"{{ review.text }}"</div>
            <div class="review-reason">原因：{{ review.reason }}</div>
        </div>
        {% endfor %}

        <div class="back">
            <a href="/">← 返回首页</a>
        </div>
    </div>
</body>
</html>
